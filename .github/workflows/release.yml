name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows
            artifact_path: dist/ProjxDiff.exe
            artifact_filename: ProjxDiff-windows.exe
          - os: macos-latest
            target_name: macos
            artifact_path: dist/ProjxDiff.app
            artifact_filename: ProjxDiff-macos.zip
            zip_app: true
          - os: ubuntu-latest
            target_name: linux
            artifact_path: dist/ProjxDiff-linux
            artifact_filename: ProjxDiff-linux

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      # pyodbc must be present at build time to be bundled into the frozen
      # binary — without it the shipped exe's database name-resolution
      # silently falls back to raw GUIDs (the app itself degrades cleanly,
      # but the feature is advertised). Windows is the platform that talks
      # to SQL Server in the field.
      - name: Install pyodbc for bundling (Windows)
        if: matrix.target_name == 'windows'
        run: python -m pip install pyodbc

      - name: Build
        run: python -m PyInstaller dw_compare.spec --clean --noconfirm

      # Second Windows build: the onedir variant the installer ships (no
      # %TEMP% self-extraction at launch — see dw_compare.spec). --clean
      # only clears the build workdir; dist\ProjxDiff.exe from the first
      # build survives.
      - name: Build onedir variant for the installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          $env:PROJX_ONEDIR = '1'
          python -m PyInstaller dw_compare.spec --clean --noconfirm
          if (-not (Test-Path "dist\ProjxDiff-app\ProjxDiff.exe")) { Write-Error "onedir build missing"; exit 1 }

      # Run the actual built binary through a real --sync against a tiny fake
      # site. Catches packaging breaks (missing hidden imports, bootloader
      # issues) that unit tests on source can never see.
      - name: Smoke test binary (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          python scripts/make_smoke_site.py smoke
          # The exe is windowed, so force PowerShell to wait and take the exit code.
          $p = Start-Process -FilePath "dist\ProjxDiff.exe" -ArgumentList "--sync","smoke\config.json" -Wait -PassThru -NoNewWindow
          Get-Content smoke\data\sync.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "smoke\repo\Smoke")) { Write-Error "project not archived"; exit 1 }
          # --doctor exits nonzero if the frozen exe is missing pyodbc — the
          # runtime fails soft (raw GUIDs), so only this catches the 1.5.1
          # class of packaging bug before it ships.
          $d = Start-Process -FilePath "dist\ProjxDiff.exe" -ArgumentList "--doctor" -Wait -PassThru -NoNewWindow
          if ($d.ExitCode -ne 0) { Write-Error "doctor check failed (pyodbc not bundled?)"; exit 1 }
          # Same two checks against the onedir variant the installer ships.
          python scripts/make_smoke_site.py smoke-onedir
          $q = Start-Process -FilePath "dist\ProjxDiff-app\ProjxDiff.exe" -ArgumentList "--sync","smoke-onedir\config.json" -Wait -PassThru -NoNewWindow
          if ($q.ExitCode -ne 0) { Write-Error "onedir sync failed"; exit 1 }
          if (-not (Test-Path "smoke-onedir\repo\Smoke")) { Write-Error "onedir: project not archived"; exit 1 }
          $od = Start-Process -FilePath "dist\ProjxDiff-app\ProjxDiff.exe" -ArgumentList "--doctor" -Wait -PassThru -NoNewWindow
          if ($od.ExitCode -ne 0) { Write-Error "onedir doctor check failed"; exit 1 }

      - name: Smoke test binary (macOS)
        if: matrix.target_name == 'macos'
        run: |
          python scripts/make_smoke_site.py smoke
          dist/ProjxDiff.app/Contents/MacOS/ProjxDiff --sync smoke/config.json
          cat smoke/data/sync.log
          test -d smoke/repo/Smoke

      - name: Smoke test binary (Linux)
        if: matrix.target_name == 'linux'
        run: |
          python scripts/make_smoke_site.py smoke
          dist/ProjxDiff --sync smoke/config.json
          cat smoke/data/sync.log
          test -d smoke/repo/Smoke
          cp dist/ProjxDiff dist/ProjxDiff-linux

      # Build the Windows installer from the smoke-tested exe, then prove the
      # installer itself works: silent install, then run the INSTALLED copy
      # through a real --sync.
      - name: Build installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path dw_compare/_version.py -Pattern "__version__\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version scripts\installer\ProjxDiff.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ProjxDiff-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ProjxDiffInstallTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "silent install failed"; exit 1 }
          if (-not (Test-Path "C:\ProjxDiffInstallTest\ProjxDiff.exe")) { Write-Error "installed exe missing"; exit 1 }
          python scripts/make_smoke_site.py smoke-installed
          $q = Start-Process -FilePath "C:\ProjxDiffInstallTest\ProjxDiff.exe" -ArgumentList "--sync","smoke-installed\config.json" -Wait -PassThru -NoNewWindow
          Get-Content smoke-installed\data\sync.log -ErrorAction SilentlyContinue
          if ($q.ExitCode -ne 0) { Write-Error "installed exe failed to sync"; exit 1 }

      - name: Upload installer artifact
        if: matrix.target_name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ProjxDiff-setup.exe
          path: dist/ProjxDiff-setup.exe
          if-no-files-found: error

      - name: Zip macOS app bundle
        if: matrix.zip_app == true
        run: |
          cd dist
          zip -r ProjxDiff-macos.zip ProjxDiff.app
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_filename }}
          path: |
            ${{ matrix.target_name == 'macos' && 'dist/ProjxDiff-macos.zip' || matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-windows.exe
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-macos.zip
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-linux
          path: artifacts

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-setup.exe
          path: artifacts

      # The in-app one-click updater verifies its download against this file
      # and refuses to run anything it cannot verify.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ProjxDiff-setup.exe ProjxDiff.exe ProjxDiff-macos.zip ProjxDiff-linux > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ProjxDiff-setup.exe
            artifacts/ProjxDiff.exe
            artifacts/ProjxDiff-macos.zip
            artifacts/ProjxDiff-linux
            artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: true
          prerelease: false
