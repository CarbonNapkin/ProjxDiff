name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows
            artifact_path: dist/ProjxDiff.exe
            artifact_filename: ProjxDiff-windows.exe
          - os: macos-latest
            target_name: macos
            artifact_path: dist/ProjxDiff.app
            artifact_filename: ProjxDiff-macos.zip
            zip_app: true
          - os: ubuntu-latest
            target_name: linux
            artifact_path: dist/ProjxDiff-linux
            artifact_filename: ProjxDiff-linux

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      # pyodbc must be present at build time to be bundled into the frozen
      # binary — without it the shipped exe's database name-resolution
      # silently falls back to raw GUIDs (the app itself degrades cleanly,
      # but the feature is advertised). Windows is the platform that talks
      # to SQL Server in the field.
      - name: Install pyodbc for bundling (Windows)
        if: matrix.target_name == 'windows'
        run: python -m pip install pyodbc

      - name: Build
        run: python -m PyInstaller dw_compare.spec --clean --noconfirm

      # Second Windows build: the onedir variant the installer ships (no
      # %TEMP% self-extraction at launch — see dw_compare.spec). --clean
      # only clears the build workdir; dist\ProjxDiff.exe from the first
      # build survives.
      - name: Build onedir variant for the installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          $env:PROJX_ONEDIR = '1'
          python -m PyInstaller dw_compare.spec --clean --noconfirm
          if (-not (Test-Path "dist\ProjxDiff-app\ProjxDiff.exe")) { Write-Error "onedir build missing"; exit 1 }
          if (-not (Test-Path "dist\ProjxDiff-app\ProjxDiff-cli.exe")) { Write-Error "console CLI exe missing"; exit 1 }

      # Run the actual built binary through a real --sync against a tiny fake
      # site. Catches packaging breaks (missing hidden imports, bootloader
      # issues) that unit tests on source can never see.
      - name: Smoke test binary (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          python scripts/make_smoke_site.py smoke
          # The exe is windowed, so force PowerShell to wait and take the exit code.
          $p = Start-Process -FilePath "dist\ProjxDiff.exe" -ArgumentList "--sync","smoke\config.json" -Wait -PassThru -NoNewWindow
          Get-Content smoke\data\sync.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "smoke\repo\Smoke")) { Write-Error "project not archived"; exit 1 }
          # --doctor exits nonzero if the frozen exe is missing pyodbc — the
          # runtime fails soft (raw GUIDs), so only this catches the 1.5.1
          # class of packaging bug before it ships.
          $d = Start-Process -FilePath "dist\ProjxDiff.exe" -ArgumentList "--doctor" -Wait -PassThru -NoNewWindow
          if ($d.ExitCode -ne 0) { Write-Error "doctor check failed (pyodbc not bundled?)"; exit 1 }
          # Same two checks against the onedir variant the installer ships.
          python scripts/make_smoke_site.py smoke-onedir
          $q = Start-Process -FilePath "dist\ProjxDiff-app\ProjxDiff.exe" -ArgumentList "--sync","smoke-onedir\config.json" -Wait -PassThru -NoNewWindow
          if ($q.ExitCode -ne 0) { Write-Error "onedir sync failed"; exit 1 }
          if (-not (Test-Path "smoke-onedir\repo\Smoke")) { Write-Error "onedir: project not archived"; exit 1 }
          $od = Start-Process -FilePath "dist\ProjxDiff-app\ProjxDiff.exe" -ArgumentList "--doctor" -Wait -PassThru -NoNewWindow
          if ($od.ExitCode -ne 0) { Write-Error "onedir doctor check failed"; exit 1 }
          # The console-subsystem twin is the whole point of ProjxDiff-cli.exe:
          # it must WRITE to the terminal it was launched from, and it must be
          # capturable. The checks above pass on a windowed exe that prints
          # nothing at all, which is exactly the bug this ships to fix, so
          # assert on the captured text rather than the exit code.
          $version = (Select-String -Path dw_compare/_version.py -Pattern "__version__\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          $out = (& "dist\ProjxDiff-app\ProjxDiff-cli.exe" --doctor 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Error "cli doctor exited $LASTEXITCODE"; exit 1 }
          Write-Host $out
          if ($out -notmatch [regex]::Escape("Projx Diff $version")) {
            Write-Error "ProjxDiff-cli.exe --doctor produced no usable output on the console"; exit 1
          }
          if ($out -notmatch 'frozen binary') { Write-Error "cli exe is not the frozen build"; exit 1 }
          # ...and when redirected, which AttachConsole would not survive.
          & "dist\ProjxDiff-app\ProjxDiff-cli.exe" --doctor > cli-doctor.txt 2>&1
          if (-not (Select-String -Path cli-doctor.txt -Pattern ([regex]::Escape("Projx Diff $version")) -Quiet)) {
            Write-Error "ProjxDiff-cli.exe output could not be redirected to a file"; exit 1
          }

      - name: Smoke test binary (macOS)
        if: matrix.target_name == 'macos'
        run: |
          python scripts/make_smoke_site.py smoke
          dist/ProjxDiff.app/Contents/MacOS/ProjxDiff --sync smoke/config.json
          cat smoke/data/sync.log
          test -d smoke/repo/Smoke

      - name: Smoke test binary (Linux)
        if: matrix.target_name == 'linux'
        run: |
          python scripts/make_smoke_site.py smoke
          dist/ProjxDiff --sync smoke/config.json
          cat smoke/data/sync.log
          test -d smoke/repo/Smoke
          cp dist/ProjxDiff dist/ProjxDiff-linux

      # Build the Windows installer from the smoke-tested exe, then prove the
      # installer itself works: silent install, then run the INSTALLED copy
      # through a real --sync.
      - name: Build installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path dw_compare/_version.py -Pattern "__version__\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version scripts\installer\ProjxDiff.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test installer (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ProjxDiff-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ProjxDiffInstallTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "silent install failed"; exit 1 }
          if (-not (Test-Path "C:\ProjxDiffInstallTest\ProjxDiff.exe")) { Write-Error "installed exe missing"; exit 1 }
          if (-not (Test-Path "C:\ProjxDiffInstallTest\ProjxDiff-cli.exe")) { Write-Error "installed CLI exe missing"; exit 1 }
          $iv = (& "C:\ProjxDiffInstallTest\ProjxDiff-cli.exe" --doctor 2>&1 | Out-String)
          Write-Host $iv
          if ($iv -notmatch 'Projx Diff') { Write-Error "installed CLI exe printed nothing"; exit 1 }
          python scripts/make_smoke_site.py smoke-installed
          $q = Start-Process -FilePath "C:\ProjxDiffInstallTest\ProjxDiff.exe" -ArgumentList "--sync","smoke-installed\config.json" -Wait -PassThru -NoNewWindow
          Get-Content smoke-installed\data\sync.log -ErrorAction SilentlyContinue
          if ($q.ExitCode -ne 0) { Write-Error "installed exe failed to sync"; exit 1 }

      # #7 in CI: the failure was an upgrade silently leaving the nightly task
      # pointing at the old binary. Stage exactly that -- a task naming a
      # ProjxDiff.exe somewhere else -- and prove the installer repoints it
      # without disturbing the schedule or the config path. Then prove it
      # refuses a command that is not ours, which is the guard that keeps this
      # from becoming the 2026-08-16 incident in installer form.
      - name: Installer repoints a stale nightly task (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          $task = 'ProjxDiff Nightly Sync'
          $stale = 'C:\Program Files (x86)\Projx Diff\ProjxDiff.exe'
          $args  = '--sync "C:\ProjxArchive\config.json"'
          schtasks /Create /F /TN $task /TR "`"$stale`" $args" /SC DAILY /ST 02:00 /RU SYSTEM /RL HIGHEST
          if ($LASTEXITCODE -ne 0) { Write-Error "could not stage the task"; exit 1 }

          $p = Start-Process -FilePath "dist\ProjxDiff-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ProjxDiffInstallTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "reinstall failed"; exit 1 }

          $a = (Get-ScheduledTask -TaskName $task).Actions[0]
          Write-Host "after install: $($a.Execute) $($a.Arguments)"
          if ($a.Execute -ne 'C:\ProjxDiffInstallTest\ProjxDiff.exe') {
            Write-Error "task was not repointed at the new install"; exit 1
          }
          if ($a.Arguments -notmatch 'ProjxArchive') {
            Write-Error "the site's config path was not preserved"; exit 1
          }
          $t = Get-ScheduledTask -TaskName $task
          if ($t.Triggers[0].StartBoundary -notmatch 'T02:00') {
            Write-Error "the schedule was not preserved"; exit 1
          }

          # A command that is not a Projx Diff executable belongs to something
          # else. Leave it exactly as found.
          schtasks /Create /F /TN $task /TR "x" /SC DAILY /ST 02:00 /RU SYSTEM /RL HIGHEST
          $p = Start-Process -FilePath "dist\ProjxDiff-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ProjxDiffInstallTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "reinstall failed"; exit 1 }
          $a = (Get-ScheduledTask -TaskName $task).Actions[0]
          Write-Host "after install (foreign command): $($a.Execute)"
          if ($a.Execute -ne 'x') { Write-Error "installer rewrote a task that is not ours"; exit 1 }

          schtasks /Delete /F /TN $task

          # And with no task at all it must stay that way -- an installer that
          # invents a nightly job on a machine that never asked for one is not
          # a repair.
          $p = Start-Process -FilePath "dist\ProjxDiff-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ProjxDiffInstallTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "reinstall failed"; exit 1 }
          if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) {
            Write-Error "installer created a nightly task out of nothing"; exit 1
          }

      - name: Upload installer artifact
        if: matrix.target_name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ProjxDiff-setup.exe
          path: dist/ProjxDiff-setup.exe
          if-no-files-found: error

      - name: Zip macOS app bundle
        if: matrix.zip_app == true
        run: |
          cd dist
          zip -r ProjxDiff-macos.zip ProjxDiff.app
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_filename }}
          path: |
            ${{ matrix.target_name == 'macos' && 'dist/ProjxDiff-macos.zip' || matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-windows.exe
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-macos.zip
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-linux
          path: artifacts

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-setup.exe
          path: artifacts

      # The in-app one-click updater verifies its download against this file
      # and refuses to run anything it cannot verify.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ProjxDiff-setup.exe ProjxDiff.exe ProjxDiff-macos.zip ProjxDiff-linux > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ProjxDiff-setup.exe
            artifacts/ProjxDiff.exe
            artifacts/ProjxDiff-macos.zip
            artifacts/ProjxDiff-linux
            artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: true
          prerelease: false
