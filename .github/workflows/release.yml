name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows
            artifact_path: dist/ProjxDiff.exe
            artifact_filename: ProjxDiff-windows.exe
          - os: macos-latest
            target_name: macos
            artifact_path: dist/ProjxDiff.app
            artifact_filename: ProjxDiff-macos.zip
            zip_app: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: python -m PyInstaller dw_compare.spec --clean --noconfirm

      # Run the actual built binary through a real --sync against a tiny fake
      # site. Catches packaging breaks (missing hidden imports, bootloader
      # issues) that unit tests on source can never see.
      - name: Smoke test binary (Windows)
        if: matrix.target_name == 'windows'
        shell: pwsh
        run: |
          python scripts/make_smoke_site.py smoke
          # The exe is windowed, so force PowerShell to wait and take the exit code.
          $p = Start-Process -FilePath "dist\ProjxDiff.exe" -ArgumentList "--sync","smoke\config.json" -Wait -PassThru -NoNewWindow
          Get-Content smoke\data\sync.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "smoke\repo\Smoke")) { Write-Error "project not archived"; exit 1 }

      - name: Smoke test binary (macOS)
        if: matrix.target_name == 'macos'
        run: |
          python scripts/make_smoke_site.py smoke
          dist/ProjxDiff.app/Contents/MacOS/ProjxDiff --sync smoke/config.json
          cat smoke/data/sync.log
          test -d smoke/repo/Smoke

      - name: Zip macOS app bundle
        if: matrix.zip_app == true
        run: |
          cd dist
          zip -r ProjxDiff-macos.zip ProjxDiff.app
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_filename }}
          path: |
            ${{ matrix.target_name == 'macos' && 'dist/ProjxDiff-macos.zip' || matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-windows.exe
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ProjxDiff-macos.zip
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ProjxDiff.exe
            artifacts/ProjxDiff-macos.zip
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: true
          prerelease: false
